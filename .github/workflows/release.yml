name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 下载探针主题资源（build.rs 和 rust-embed 需要）
      - name: Download default theme
        working-directory: server
        run: sh scripts/theme.sh

      # 2. 构建前端（Rust binary 会通过 rust-embed 内嵌 dist/）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/web-admin/package-lock.json

      - name: Build frontend
        working-directory: server/web-admin
        run: npm ci && npm run build

      # 3. 安装 Rust 工具链
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 4. 安装 cross（用于交叉编译 musl 静态二进制）
      - name: Install cross
        run: cargo install --locked cross

      # 5. 编译
      - name: Build
        working-directory: server
        run: cross build --release --locked --target ${{ matrix.target }}

      # 6. 整理产物，统一命名为 monitor-hub-linux-amd64 / monitor-hub-linux-arm64
      - name: Prepare artifact
        run: |
          ARCH=$(echo "${{ matrix.target }}" | grep -q 'aarch64' && echo 'arm64' || echo 'amd64')
          cp "server/target/${{ matrix.target }}/release/monitor-hub" "monitor-hub-linux-${ARCH}"
          chmod +x "monitor-hub-linux-${ARCH}"
          echo "ASSET_NAME=monitor-hub-linux-${ARCH}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          (cd bin && sha256sum monitor-hub-linux-* > sha256sums.txt)
          gh release create "$GITHUB_REF_NAME" bin/monitor-hub-linux-* bin/sha256sums.txt \
            --title "ProxyProbe $GITHUB_REF_NAME" \
            --notes "## ProxyProbe ${GITHUB_REF_NAME}

          ### 一键部署主控端

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/2290145679/ProxyProbe/main/scripts/deploy-hub.sh | bash
          \`\`\`

          ### 下载

          | 架构 | 文件 |
          |------|------|
          | x86_64 (amd64) | \`monitor-hub-linux-amd64\` |
          | ARM64 | \`monitor-hub-linux-arm64\` |"
        env:
          GH_TOKEN: ${{ github.token }}
