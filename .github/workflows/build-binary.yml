name: Build Proxy Manager Binary

on:
  push:
    branches: [main]
    paths:
      - 'proxy_manager.py'
      - 'license_guard.py'
      - '.github/workflows/build-binary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Build Linux AMD64 Binary
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller cryptography

      - name: Compile proxy_manager with PyInstaller
        run: |
          pyinstaller --clean --onefile --name proxy-manager-linux-amd64 --strip --hidden-import license_guard proxy_manager.py

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-manager-linux-amd64
          path: dist/proxy-manager-linux-amd64
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64 Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build ARM64 binary with PyInstaller via Docker
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            python:3.11-slim bash -c "
              set -e
              apt-get update -qq && apt-get install -y -qq binutils gcc python3-dev
              pip install --upgrade pip -q
              pip install pyinstaller cryptography -q
              pyinstaller --clean --onefile --name proxy-manager-linux-arm64 --strip --hidden-import license_guard proxy_manager.py
              chmod 755 dist/proxy-manager-linux-arm64
            "

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-manager-linux-arm64
          path: dist/proxy-manager-linux-arm64
          if-no-files-found: error

  sync-to-release:
    name: Sync Binaries to Release Repo
    needs: [build-linux-amd64, build-linux-arm64]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: proxy-manager-linux-amd64
          path: dist-release

      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: proxy-manager-linux-arm64
          path: dist-release

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v2.5.31")
          echo "Uploading binaries to release $LATEST_TAG..."
          gh release upload "$LATEST_TAG" dist-release/proxy-manager-linux-amd64 dist-release/proxy-manager-linux-arm64 --clobber
          echo "Successfully updated ProxyProbe release assets!"
