name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A v* tag can be neither moved nor deleted, and one that differs from
      # theme.json would be offered as an update forever: stop before publishing.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=v$(node -p 'require("./theme.json").version')
          [ "$GITHUB_REF_NAME" = "$V" ] || { echo "::error::tag $GITHUB_REF_NAME, theme.json $V"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # The archive is an installable theme directory rather than a source
      # snapshot: dist/ beside theme.json is exactly the layout the hub reads a
      # theme from on disk. The file the hub embeds at build time and the file a
      # user extracts into <themes>/<short>/ are therefore identical, and this
      # release is the reference form for a third-party theme. preview.png is the
      # panel's thumbnail, packaged beside theme.json rather than inside dist/
      # because it is metadata rather than content the theme serves.
      - run: tar czf theme.tar.gz dist theme.json preview.png
      - run: sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256

      # A manual dispatch builds and packages without publishing, so the path can
      # be exercised without cutting a release. gh ships on the runner, keeping a
      # third-party action out of the contents:write step.
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
